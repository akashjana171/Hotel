<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Successful</title><link rel="stylesheet" href="style.css"></head><body>
<div class="container"><div class="card form-card"><div class="card-body"><div class="text-center"><div style="font-size:60px">✅</div><h2>Booking Successful</h2><p>Thank you for choosing Comfort Hotel.</p></div><div id="details"></div><div class="actions no-print"><button class="btn btn-success" onclick="window.print()">🖨 Print</button><a class="btn btn-primary" href="index.html">Back to Home</a></div></div></div></div>
<script src="app.js"></script><script>
const id=qs("booking_id"),b=getBookings().find(x=>x.booking_id===id);if(!b){details.innerHTML='<div class="alert alert-danger">Booking not found.</div>'}else{const total=Number(b.price)*daysBetween(b.checkin,b.checkout);details.innerHTML=`<table class="table"><tr><th>Booking ID</th><td>${esc(b.booking_id)}</td></tr><tr><th>Guest Name</th><td>${esc(b.name)}</td></tr><tr><th>Room</th><td>${esc(b.room)}</td></tr><tr><th>Email</th><td>${esc(b.email)}</td></tr><tr><th>Mobile</th><td>${esc(b.mobile)}</td></tr><tr><th>Check In</th><td>${esc(b.checkin)}</td></tr><tr><th>Check Out</th><td>${esc(b.checkout)}</td></tr><tr><th>Guests</th><td>${b.guests}</td></tr><tr><th>Payment</th><td>${esc(b.payment_status)}</td></tr><tr><th>Booking Date</th><td>${new Date(b.booking_date).toLocaleString()}</td></tr><tr><th>Total Amount</th><td><b>${money(total)}</b></td></tr></table>`}
</script></body></html>
