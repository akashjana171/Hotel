<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../style.css"></head><body>
<div class="container"><div class="card form-card"><div class="card-body"><h2 class="text-center">🏨 Admin Login</h2><div id="error"></div><form id="login"><label>Username</label><input id="username" class="form-control" required><label>Password</label><input id="password" type="password" class="form-control" required><button class="btn btn-primary" style="width:100%">Login</button></form><p class="muted text-center">Demo: admin / admin123</p></div></div></div>
<script src="../app.js"></script><script>login.addEventListener("submit",e=>{e.preventDefault();if(username.value==="admin"&&password.value==="admin123"){sessionStorage.setItem("hotel_admin","true");location.href="dashboard.html"}else error.innerHTML='<div class="alert alert-danger">Invalid username or password.</div>'})</script></body></html>
