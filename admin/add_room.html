<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Room</title><link rel="stylesheet" href="../style.css"></head><body>
<nav class="navbar"><div class="container nav-wrap"><span class="brand">🏨 Comfort Hotel Admin Panel</span><button class="btn btn-danger" onclick="logout()">Logout</button></div></nav><div class="admin-layout"><aside class="sidebar"><h3>Admin Menu</h3><a href="dashboard.html">📊 Dashboard</a><a href="add_room.html">➕ Add Room</a><a href="manage_rooms.html">🛏 Manage Rooms</a><a href="bookings.html">📅 Bookings</a><a href="../index.html">🏠 Visit Website</a><a href="#" onclick="logout()">🚪 Logout</a></aside><main class="content"><div class="card form-card"><div class="card-body"><h2>Add New Room</h2><div id="msg"></div><form id="roomForm"><label>Room Name</label><input id="room_name" class="form-control" required><label>Room Type</label><input id="room_type" class="form-control" required><label>Price</label><input id="price" type="number" min="0" class="form-control" required><label>Status</label><select id="status" class="form-select"><option>Available</option><option>Booked</option></select><label>Image filename</label><input id="image" class="form-control" placeholder="Example: Deluxe Room.png" required><div class="actions"><button class="btn btn-success">Add Room</button><a class="btn btn-secondary" href="dashboard.html">Back</a></div></form></div></div></main></div>
<script src="../app.js"></script><script>requireAdmin();roomForm.addEventListener("submit",e=>{e.preventDefault();const r=getRooms();r.push({id:Date.now(),room_name:room_name.value,room_type:room_type.value,price:Number(price.value),status:status.value,image:image.value});saveRooms(r);msg.innerHTML='<div class="alert alert-success">Room added successfully.</div>';e.target.reset()})</script></body></html>
