<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Rooms</title><link rel="stylesheet" href="../style.css"></head><body>
<nav class="navbar"><div class="container nav-wrap"><span class="brand">🏨 Comfort Hotel Admin Panel</span><button class="btn btn-danger" onclick="logout()">Logout</button></div></nav><div class="admin-layout"><aside class="sidebar"><h3>Admin Menu</h3><a href="dashboard.html">📊 Dashboard</a><a href="add_room.html">➕ Add Room</a><a href="manage_rooms.html">🛏 Manage Rooms</a><a href="bookings.html">📅 Bookings</a><a href="../index.html">🏠 Visit Website</a><a href="#" onclick="logout()">🚪 Logout</a></aside><main class="content"><h2>Manage Rooms</h2><a class="btn btn-success" href="add_room.html">+ Add Room</a><div class="card" style="margin-top:20px"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Type</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div>
<script src="../app.js"></script><script>requireAdmin();function render(){rows.innerHTML=getRooms().map(r=>`<tr><td>${r.id}</td><td><img src="../images/${encodeURIComponent(r.image)}" width="100" height="65" style="object-fit:cover;border-radius:7px"></td><td>${esc(r.room_name)}</td><td>${esc(r.room_type)}</td><td>${money(r.price)}</td><td>${esc(r.status)}</td><td><a class="btn btn-warning" href="edit_room.html?id=${r.id}">✏ Edit</a> <button class="btn btn-danger" onclick="del(${r.id})">🗑 Delete</button></td></tr>`).join("")}function del(id){if(confirm("Delete this room?")){saveRooms(getRooms().filter(r=>r.id!==id));render()}}render()</script></body></html>
