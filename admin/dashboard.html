<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="../style.css"></head><body>
<nav class="navbar"><div class="container nav-wrap"><span class="brand">🏨 Comfort Hotel Admin Panel</span><button class="btn btn-danger" onclick="logout()">Logout</button></div></nav><div class="admin-layout"><aside class="sidebar"><h3>Admin Menu</h3><a href="dashboard.html">📊 Dashboard</a><a href="add_room.html">➕ Add Room</a><a href="manage_rooms.html">🛏 Manage Rooms</a><a href="bookings.html">📅 Bookings</a><a href="../index.html">🏠 Visit Website</a><a href="#" onclick="logout()">🚪 Logout</a></aside><main class="content"><h2>Dashboard Overview</h2><div id="stats" class="stat-grid"></div><div class="card" style="margin-top:25px"><div class="card-body"><h3>Recent Bookings</h3><div class="table-wrap"><table class="table"><thead><tr><th>Booking ID</th><th>Guest</th><th>Room</th><th>Date</th><th>Action</th></tr></thead><tbody id="recent"></tbody></table></div></div></div></main></div>
<script src="../app.js"></script><script>requireAdmin();const rooms=getRooms(),bs=getBookings(),guests=new Set(bs.map(b=>b.email)).size,revenue=bs.reduce((s,b)=>s+Number(b.price||0)*daysBetween(b.checkin,b.checkout),0);stats.innerHTML=[["🛏","Total Rooms",rooms.length],["📅","Total Bookings",bs.length],["👥","Total Guests",guests],["💰","Revenue",money(revenue)]].map(x=>`<div class="card stat"><div style="font-size:35px">${x[0]}</div><div class="number">${x[2]}</div><h4>${x[1]}</h4></div>`).join("");recent.innerHTML=bs.slice(0,10).map(b=>`<tr><td>${esc(b.booking_id)}</td><td>${esc(b.name)}</td><td>${esc(b.room)}</td><td>${new Date(b.booking_date).toLocaleDateString()}</td><td><a class="btn btn-primary" href="bookings.html">View</a></td></tr>`).join("")||'<tr><td colspan="5" class="text-center">No bookings</td></tr>';</script></body></html>
