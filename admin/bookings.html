<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Bookings</title><link rel="stylesheet" href="../style.css"></head><body>
<nav class="navbar"><div class="container nav-wrap"><span class="brand">🏨 Comfort Hotel Admin Panel</span><button class="btn btn-danger" onclick="logout()">Logout</button></div></nav><div class="admin-layout"><aside class="sidebar"><h3>Admin Menu</h3><a href="dashboard.html">📊 Dashboard</a><a href="add_room.html">➕ Add Room</a><a href="manage_rooms.html">🛏 Manage Rooms</a><a href="bookings.html">📅 Bookings</a><a href="../index.html">🏠 Visit Website</a><a href="#" onclick="logout()">🚪 Logout</a></aside><main class="content"><h2>Manage Bookings</h2><div class="card"><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th>Booking ID</th><th>Guest</th><th>Room</th><th>Mobile</th><th>Email</th><th>Check In</th><th>Check Out</th><th>Guests</th><th>Payment</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div>
<script src="../app.js"></script><script>requireAdmin();function render(){const bs=getBookings();rows.innerHTML=bs.map(b=>`<tr><td><b>${esc(b.booking_id)}</b></td><td>${esc(b.name)}</td><td>${esc(b.room)}</td><td>${esc(b.mobile)}</td><td>${esc(b.email)}</td><td>${esc(b.checkin)}</td><td>${esc(b.checkout)}</td><td>${b.guests}</td><td>${esc(b.payment_status)}</td><td><button class="btn btn-danger" onclick="del('${b.booking_id}')">🗑 Delete</button></td></tr>`).join("")||'<tr><td colspan="10" class="text-center">No bookings found</td></tr>'}function del(id){if(confirm("Delete this booking?")){saveBookings(getBookings().filter(b=>b.booking_id!==id));render()}}render()</script></body></html>
