<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comfort Hotel - Booking</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><div class="container nav-wrap"><a class="brand" href="index.html">🏨 Comfort Hotel</a><a class="btn btn-light" href="index.html">Home</a></div></nav>
<div class="container"><div class="card form-card"><div class="card-body"><h2 class="text-center">🏨 Room Booking</h2><div id="error"></div><form id="bookingForm">
<label>Selected Room</label><select id="room" class="form-select" required></select><label>Full Name</label><input id="name" class="form-control" required placeholder="Enter Full Name"><label>Email</label><input id="email" type="email" class="form-control" required placeholder="example@gmail.com"><label>Mobile Number</label><input id="mobile" type="tel" class="form-control" pattern="[0-9]{10}" maxlength="10" required placeholder="10 digit mobile number"><label>Check In</label><input id="checkin" type="date" class="form-control" required><label>Check Out</label><input id="checkout" type="date" class="form-control" required><label>Number of Guests</label><input id="guests" type="number" class="form-control" min="1" max="10" required><label>Special Request</label><textarea id="message" rows="4" class="form-control" placeholder="Write your special request"></textarea>
<div class="alert alert-info"><b>Booking Information</b><ul><li>Check-In: 12:00 PM</li><li>Check-Out: 11:00 AM</li><li>Payment Status: Pending</li><li>Please carry a valid ID proof.</li></ul></div><div class="actions"><button class="btn btn-success" type="submit">🏨 Confirm Booking</button><a class="btn btn-secondary" href="index.html">← Back</a></div></form></div></div></div>
<script src="app.js"></script><script>
const roomSelect=document.getElementById("room"),rooms=getRooms(),selected=qs("room");roomSelect.innerHTML=rooms.map(r=>`<option value="${esc(r.room_name)}" ${r.room_name===selected?"selected":""} ${r.status!=="Available"?"disabled":""}>${esc(r.room_name)} - ${money(r.price)}/night (${r.status})</option>`).join("");
const today=new Date().toISOString().split("T")[0];checkin.min=today;checkout.min=today;checkin.addEventListener("change",()=>checkout.min=checkin.value);
bookingForm.addEventListener("submit",e=>{e.preventDefault();if(new Date(checkout.value)<=new Date(checkin.value)){error.innerHTML='<div class="alert alert-danger">Check-out date must be after check-in date.</div>';return}
const id=bookingId(),r=rooms.find(x=>x.room_name===roomSelect.value),b={id,booking_id:id,room:roomSelect.value,name:name.value,email:email.value,mobile:mobile.value,checkin:checkin.value,checkout:checkout.value,guests:Number(guests.value),message:message.value,payment_status:"Pending",booking_date:new Date().toISOString(),price:r?Number(r.price):0};
const all=getBookings();all.unshift(b);saveBookings(all);location.href="booking_success.html?booking_id="+encodeURIComponent(id)});
</script></body></html>
